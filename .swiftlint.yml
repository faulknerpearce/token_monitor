# SwiftLint configuration for TokenMon.
# `make lint` runs this with --strict: every warning is an error.

included:
  - TokenMon
  - TokenMonTests
  - Tests

excluded:
  - build
  - dist
  - .build
  - DerivedData

# Length thresholds tuned to this codebase (menu bar renderer and panel views run long).
line_length:
  warning: 160
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 850
  error: 1000

file_length:
  warning: 900
  error: 1100
  ignore_comment_only_lines: true

function_body_length:
  warning: 200
  error: 300

function_parameter_count:
  warning: 12
  error: 14

cyclomatic_complexity:
  warning: 26
  error: 32

large_tuple:
  warning: 4
  error: 6

identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - x
    - y
    - db
    - n
    - i
  allowed_symbols:
    - _

type_name:
  min_length: 3
  max_length: 60

# Opt-in rules that match the project conventions.
# Not enabled (do not fit this codebase): type_contents_order,
# switch_case_on_newline, vertical_whitespace_between_cases, required_deinit,
# single_test_class, object_literal, attributes, implicit_return.
# redundant_nil_coalescing: misfires on double optionals.
# discouraged_optional_boolean and force_unwrapping: not enforced by the gate.
opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - last_where
  - legacy_multiple
  - legacy_random
  - modifier_order
  - non_optional_string_data_conversion
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - protocol_property_accessors_order
  - reduce_into
  - redundant_type_annotation
  - shorthand_operator
  - sorted_first_last
  - sorted_imports
  - static_operator
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher

reporter: "xcode"
