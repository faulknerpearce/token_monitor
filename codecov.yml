codecov:
  require_ci_to_pass: false

coverage:
  status:
    # Project-wide coverage is informational; the patch status gates PRs.
    project:
      default:
        informational: true
    patch:
      default:
        target: 50%
        only_pulls: true

# UI-heavy files excluded from coverage: SwiftUI views and the custom-drawn
# bars, rows, and charts that do not end in "View.swift".
ignore:
  - "TokenMon/App/AppDelegate.swift"
  - "TokenMon/Features/**/*View.swift"
  - "TokenMon/Features/**/*Bar.swift"
  - "TokenMon/Features/**/*Row.swift"
  - "TokenMon/Features/**/*Chart.swift"
  - "Tests/Manual/**"
