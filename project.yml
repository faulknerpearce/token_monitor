name: TokenMon
options:
  bundleIdPrefix: com.modelmonitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Xcode 16+ moves Debug app code into a .debug.dylib by default; that layout
    # breaks ad-hoc-signed TEST_HOST runs intermittently ('module name ""').
    ENABLE_DEBUG_DYLIB: NO
targets:
  TokenMon:
    type: application
    platform: macOS
    sources:
      - path: TokenMon
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modelmonitor.app
        PRODUCT_NAME: TokenMon
        PRODUCT_MODULE_NAME: TokenMon
        INFOPLIST_FILE: TokenMon/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TokenMon/Resources/TokenMon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.2"
        CURRENT_PROJECT_VERSION: "9"
        PRIVACY_MANIFEST_FILE: TokenMon/Resources/PrivacyInfo.xcprivacy
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    entitlements:
      path: TokenMon/Resources/TokenMon.entitlements
  TokenMonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenMonTests
    dependencies:
      - target: TokenMon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modelmonitor.tests
        PRODUCT_NAME: TokenMonTests
        PRODUCT_MODULE_NAME: TokenMonTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TokenMon.app/Contents/MacOS/TokenMon"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTING_SEARCH_PATHS: YES
schemes:
  TokenMon:
    build:
      targets:
        TokenMon: all
        TokenMonTests: [test]
    test:
      targets:
        - TokenMonTests
    run:
      config: Debug
