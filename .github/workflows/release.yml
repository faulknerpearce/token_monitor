name: Release

# Pushing a tag vX.Y.Z (matching MARKETING_VERSION in project.yml) runs every
# CI gate (lint, format, project drift, secret scan, core and unit tests, and
# the Release build) against the tagged commit, then builds the app zip, pkg,
# and dSYM zip and attaches them to that GitHub Release. The in-app updater
# downloads TokenMon-*.zip from releases/latest and checks it against the
# SHA-256 digest GitHub records for the asset.
#
# The runner has no Developer ID certificate, so these files are ad-hoc signed.
# Gatekeeper warns on a first download. An already-installed copy can still
# replace itself from the zip.
#
# The first run keeps assets already attached to the release; re-running the
# workflow run (run attempt 2 or later) replaces them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Tag matches MARKETING_VERSION
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the tag to match MARKETING_VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/.*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
          test -n "$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match MARKETING_VERSION ${version}."
            echo "Bump project.yml, or tag v${version}."
            exit 1
          fi

  gates:
    name: CI gates
    needs: check-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish zip, pkg, and dSYMs
    needs: gates
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `make release` numbers the build by commit count.
          fetch-depth: 0
          persist-credentials: false

      # The committed project is used as-is; the gates job fails on drift.
      - name: Build release zip, pkg, and dSYM zip
        run: make release

      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          files=(
            "dist/TokenMon-${version}.zip"
            "dist/TokenMon-${version}.pkg"
            "dist/TokenMon-${version}-dSYM.zip"
          )
          for file in "${files[@]}"; do
            test -f "$file"
          done
          # A tag push alone creates no release. This step creates one when the
          # tag has none yet and keeps hand-written notes on an existing one.
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            clashes=()
            for file in "${files[@]}"; do
              if grep -Fxq "$(basename "$file")" <<<"$existing"; then
                clashes+=("$(basename "$file")")
              fi
            done
            if [ "${#clashes[@]}" -gt 0 ]; then
              if [ "$RUN_ATTEMPT" -le 1 ]; then
                echo "Release $tag already has: ${clashes[*]}"
                echo "Refusing to replace published assets. Delete them, or re-run this workflow run to replace them."
                exit 1
              fi
              echo "Re-run (attempt $RUN_ATTEMPT): replacing ${clashes[*]}"
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release upload "$tag" "${files[@]}"
            fi
          else
            gh release create "$tag" "${files[@]}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
