name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macos-26 ships Xcode 26.x — the same major toolchain used for local
# development — so the full hosted XCTest suite (`make test`) runs there.
# The macos-26 jobs use the runner's selected Xcode rather than pinning an
# exact point release (Xcode_26.6.app), so an image bump does not break them.
jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.59.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o /tmp/swiftlint.zip
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install "$(find /tmp/swiftlint -type f -name swiftlint | head -1)" /usr/local/bin/swiftlint
          # The macos-15 image ships a SwiftLint in /opt/homebrew/bin that
          # precedes /usr/local/bin on PATH. Prepend the pinned copy so both the
          # version check and `make lint` use SWIFTLINT_VERSION.
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          test "$(/usr/local/bin/swiftlint version)" = "$SWIFTLINT_VERSION"

      - name: Lint
        run: make lint

  format:
    name: SwiftFormat
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SWIFTFORMAT_VERSION: "0.62.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat (pinned)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -q -o /tmp/swiftformat.zip -d /tmp/swiftformat
          BIN="$(find /tmp/swiftformat -type f -name swiftformat | head -1)"
          sudo install "$BIN" /usr/local/bin/swiftformat
          # The macos-15 image ships a newer SwiftFormat in /opt/homebrew/bin,
          # which precedes /usr/local/bin on PATH. Prepend the pinned copy so
          # both the version check and `make format` use SWIFTFORMAT_VERSION.
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          test "$(/usr/local/bin/swiftformat --version)" = "$SWIFTFORMAT_VERSION"

      - name: Format check
        run: make format

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # Full history so `gitleaks dir` + `detect --all` see every commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      # Same commands as `make secrets` (working tree + full history).
      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact -v

      - name: Scan full history
        run: gitleaks detect --no-banner --redact -v --log-opts="--all"

  xcodegen-drift:
    name: XcodeGen drift check
    runs-on: macos-15
    timeout-minutes: 10
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          test "$(/tmp/xcodegen/xcodegen/bin/xcodegen version | awk '{print $2}')" = "$XCODEGEN_VERSION"

      - name: Regenerate project and fail on drift
        run: |
          set -euo pipefail
          /tmp/xcodegen/xcodegen/bin/xcodegen generate
          # `git status --porcelain` also sees untracked generated files (e.g. a
          # new .xcscheme), which `git diff --exit-code` would miss.
          if [ -n "$(git status --porcelain TokenMon.xcodeproj)" ]; then
            echo "XcodeGen drift detected in TokenMon.xcodeproj:"
            git status --porcelain TokenMon.xcodeproj
            git diff -- TokenMon.xcodeproj
            exit 1
          fi

  core-tests:
    name: Core parser tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --find swiftc
          swift --version

      - name: Core parser tests
        run: make test-core

  unit-tests:
    name: Build & unit tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          test "$(/tmp/xcodegen/xcodegen/bin/xcodegen version | awk '{print $2}')" = "$XCODEGEN_VERSION"
          sudo ln -sf /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen

      - name: Regenerate Xcode project
        run: make project

      - name: Build & run unit tests with coverage
        run: make test

      - name: Convert coverage for Codecov
        run: |
          xcrun xccov view --report build/DerivedData/Logs/Test/*.xcresult > coverage.txt

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          # Non-blocking until a CODECOV_TOKEN is configured; coverage is
          # informational (codecov.yml).
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  build-release:
    name: Release build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Do not build/upload release artifacts from a red master: every gate must
    # pass first.
    needs: [lint, format, secrets, xcodegen-drift, core-tests, unit-tests]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          test "$(/tmp/xcodegen/xcodegen/bin/xcodegen version | awk '{print $2}')" = "$XCODEGEN_VERSION"
          sudo ln -sf /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen

      - name: Regenerate Xcode project
        run: make project

      - name: Build Release .app + pkg + zip
        run: make release

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
